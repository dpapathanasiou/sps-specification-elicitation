[project]
name = "algobot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Denis Papathanasiou", email = "denis@papathanasiou.org" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chardet>=7.4.3",
    "chromadb>=1.5.9",
    "esprima>=4.0.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.14.2",
    "sentence-transformers>=5.6.1",
    "smolagents[docker,gradio,litellm,mcp,telemetry,toolkit]>=1.26.0",
    "tree-sitter>=0.26.0",
    "unstructured[local-inference]>=0.25.2",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
